sudo: false
dist: jammy

addons:
  apt:
    packages:
    - uuid-dev

before_install:
- sudo tar -xzpf openssl-1.1.1.tar.gz -C /usr/local/lib/
- sudo tar zxfp otp22.3.4.27_jammy.tar.gz --strip-components=2 -C /usr/local/

before_script:
- kerl list installations
- echo "'127.0.0.1'." > ~/.hosts.erlang
- rm -rf rebar3
- git clone --branch 3.13.3 https://github.com/erlang/rebar3.git
- cd rebar3 && ./bootstrap
- ./rebar3 local install && export PATH=~/.cache/rebar3/bin:$PATH
- echo "which rebar3 " && which rebar3
- cd ..

script:
- "./rebar3/rebar3 compile"
- "./rebar3/rebar3 eunit"

notifications:
  email: false
